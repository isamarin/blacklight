version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "github-actions"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    labels:
      - "pnpm"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    versioning-strategy: increase
    groups:
      security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
      react:
        applies-to: version-updates
        patterns:
          - "react*"
          - "@types/react*"
      fumadocs:
        applies-to: version-updates
        patterns:
          - "fumadocs-*"
