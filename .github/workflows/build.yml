name: Build Workflow

on:
  push:
    branches:
      - main
      - feature/*
    tags:
      - v*
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/*.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/*.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      reset_cache:
        description: 'Reset cache'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  node_version: 24
  reset_cache: ${{ inputs.reset_cache || false }}

jobs:
  lint_workspace:
    name: "Workspace: Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Lint workspace
        run: pnpm lint

  test_workspace:
    name: "Workspace: Run tests"
    runs-on: ubuntu-latest
    needs: [lint_workspace]
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Run workspace tests
        run: pnpm test

  smoke_e2e:
    name: "E2E: Auth & stream smoke"
    runs-on: ubuntu-latest
    needs: [test_workspace]
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Run auth/stream smoke (API + static UI)
        run: pnpm smoke:e2e

  check_tauri:
    name: "Tauri: Typecheck UI"
    runs-on: ubuntu-latest
    needs: [test_workspace]
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Typecheck SvelteKit UI
        run: pnpm check:tauri

  build_web:
    name: "Tauri: Build static web"
    runs-on: ubuntu-latest
    needs: [check_tauri]
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Build static web for Cloudflare Pages
        run: pnpm build:pages

      - name: Publish web build
        uses: actions/upload-artifact@v7
        with:
          name: blacklight-web
          path: |
            packages/pages/public/*

  tauri_macos:
    name: "Tauri: Build macOS"
    runs-on: macos-latest
    needs: [check_tauri]
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop-tauri/src-tauri

      - name: Build Tauri app
        run: pnpm desktop-tauri tauri:build

      - name: Publish Mac DMG
        uses: actions/upload-artifact@v7
        with:
          name: blacklight-tauri-macos.dmg
          path: |
            packages/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
        if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[build]')

      - name: Release Mac DMG
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v26.') || startsWith(github.ref, 'refs/tags/v2026.')
        with:
          files: packages/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          draft: true

  tauri_windows:
    name: "Tauri: Build Windows"
    runs-on: windows-latest
    needs: [tauri_macos]
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}
          clean: 'true'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop-tauri/src-tauri

      - name: Build Tauri app
        run: pnpm desktop-tauri tauri:build

      - name: Publish Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: blacklight-tauri-win.exe
          path: |
            packages/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
        if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[build]')

      - name: Release Windows installer
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v26.') || startsWith(github.ref, 'refs/tags/v2026.')
        with:
          files: packages/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          draft: true

  build_docs:
    name: "Global: Build Docs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Build docs
        run: pnpm --filter @blacklight/docs build

      - name: Upload static files as artifact
        id: deployment-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/out/

  deploy:
    name: "Global: Deploy Docs"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_docs
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment-pages
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Info
        run: echo "Deployed to ${{ steps.deployment-pages.outputs.page_url }}"

  dependabot-merge:
    name: "Dependabot Auto-Merge Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: [lint_workspace, test_workspace, build_docs]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
