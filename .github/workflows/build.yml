name: Build Workflow

on:
  push:
    branches:
      - main
      - feature/*
    tags:
      - v*
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/*.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/*.yml'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      reset_cache:
        description: 'Reset cache'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  node_version: 24
  reset_cache: ${{ inputs.reset_cache || false }}

jobs:
  lint_workspace:
    name: "Workspace: Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Lint workspace
        run: pnpm lint

  test_workspace:
    name: "Workspace: Run tests"
    runs-on: ubuntu-latest
    needs: [lint_workspace]
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Run workspace tests
        run: pnpm test

  smoke_e2e:
    name: "E2E: Auth & stream smoke"
    runs-on: ubuntu-latest
    needs: [test_workspace]
    timeout-minutes: 20
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Run auth/stream smoke (API + static UI)
        run: pnpm smoke:e2e

  check_tauri:
    name: "Tauri: Typecheck UI"
    runs-on: ubuntu-latest
    needs: [test_workspace]
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Typecheck SvelteKit UI
        run: pnpm check:tauri

  build_web:
    name: "Tauri: Build static web"
    runs-on: ubuntu-latest
    needs: [check_tauri]
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Build static web for Cloudflare Pages
        run: pnpm build:pages

      - name: Publish web build
        uses: actions/upload-artifact@v7
        with:
          name: blacklight-web
          path: |
            packages/pages/public/*

  tauri_desktop:
    name: "Tauri: Build ${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    needs: [check_tauri]
    if: github.actor != 'dependabot[bot]'
    timeout-minutes: 60
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # One runner per architecture: the API sidecar is `pkg`-compiled for
          # the host tuple, so every target has to be built natively.
          - label: macOS (Apple Silicon)
            os: macos-latest
            artifact: blacklight-macos-aarch64
            bundles: |
              packages/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          - label: macOS (Intel)
            os: macos-13
            artifact: blacklight-macos-x64
            bundles: |
              packages/desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          - label: Windows (x64)
            os: windows-latest
            artifact: blacklight-windows-x64
            bundles: |
              packages/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          - label: Linux (x64)
            os: ubuntu-22.04
            artifact: blacklight-linux-x64
            bundles: |
              packages/desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
              packages/desktop-tauri/src-tauri/target/release/bundle/rpm/*.rpm
              packages/desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Tauri v2 on Linux needs the WebKitGTK 4.1 stack plus patchelf for the
      # AppImage. ubuntu-22.04 is the oldest runner still supported, which keeps
      # the produced glibc requirement as low as GitHub allows.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            rpm

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}
          clean: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop-tauri/src-tauri
          key: ${{ matrix.artifact }}

      - name: Build Tauri app
        run: pnpm desktop-tauri tauri:build

      - name: Publish installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
        if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[build]')

      - name: Attach installers to draft release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v26.') || startsWith(github.ref, 'refs/tags/v2026.')
        with:
          files: ${{ matrix.bundles }}
          draft: true

  build_docs:
    name: "Global: Build Docs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.node_version }}

      - name: Build docs
        run: pnpm --filter @blacklight/docs build

      - name: Upload static files as artifact
        id: deployment-pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/out/

  deploy:
    name: "Global: Deploy Docs"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_docs
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment-pages
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Info
        run: echo "Deployed to ${{ steps.deployment-pages.outputs.page_url }}"

  dependabot-merge:
    name: "Dependabot Auto-Merge Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: [lint_workspace, test_workspace, build_docs]
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
