name: Setup pnpm and Node
description: Install pnpm, Node.js, and workspace dependencies

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '24'
  pnpm-version:
    description: pnpm version
    required: false
    default: '10.4.1'
  install:
    description: Run pnpm install --frozen-lockfile
    required: false
    default: 'true'
  clean:
    description: Remove node_modules before install
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Reset node_modules
      if: inputs.clean == 'true' || env.reset_cache == 'true'
      shell: bash
      run: rm -rf node_modules

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
